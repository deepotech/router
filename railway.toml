[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[services.router]
startCommand = "cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static && HOSTNAME=0.0.0.0 node .next/standalone/server.js"

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.worker]
startCommand = "npm run worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
